<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f6f2">
  <meta name="description" content="A personal company research hub and recruiter-ready pitch card studio.">
  <title>Neural Hub | Research meets first impressions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/network.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <main id="app" class="app-shell"></main>
  <dialog id="node-dialog" aria-labelledby="dialog-title">
    <form id="node-form" method="dialog" class="dialog-form">
      <div class="dialog-heading"><div><p class="eyebrow">Company network</p><h2 id="dialog-title">Add a company</h2></div><button type="button" class="icon-button" data-action="dismiss-node-dialog" aria-label="Close dialog">×</button></div>
      <label for="f-company">Company</label><input id="f-company" name="company" autocomplete="organization" required>
      <label for="f-site">Website</label><input id="f-site" name="site" type="url" placeholder="https://example.com">
      <label for="f-offer">What they offer</label><textarea id="f-offer" name="offer"></textarea>
      <label for="f-job">Role / career notes</label><textarea id="f-job" name="job"></textarea>
      <label for="f-notes">My notes</label><textarea id="f-notes" name="notes"></textarea>
      <label for="f-status">Status</label><select id="f-status" name="status"><option>Researching</option><option>Applied</option><option>Interview</option><option>Offer</option><option>Passed</option></select>
      <p class="form-feedback" id="node-form-feedback" role="status" aria-live="polite"></p>
      <div class="dialog-actions"><button type="button" class="button" data-action="dismiss-node-dialog">Cancel</button><button type="submit" class="button button-primary" id="save-node" value="save">Save company</button></div>
    </form>
  </dialog>
</body>
</html>
